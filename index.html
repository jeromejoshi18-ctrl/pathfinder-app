<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Pathfinder App V6.1</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    /* ALL STYLES BUNDLED HERE */
    :root, [data-theme="light"] {
      --bg: #f0f4f8; --bg2: #ffffff; --bg3: #e8edf3; --card: #ffffff;
      --border: #d1dae6; --accent: #2563eb; --a2: #059669; --amb: #d97706;
      --red: #dc2626; --txt: #1e293b; --mut: #64748b; --r: 12px;
    }
    body { font-family: sans-serif; background: var(--bg); color: var(--txt); margin: 0; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }
    #splash-screen { position: fixed; inset: 0; background: #0047ab; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.5s; }
    #offline-screen { position: fixed; inset: 0; background: white; z-index: 11000; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px; }
    /* (I have included all the critical CSS for your buttons, cards, and chat) */
    .btn-main { background: var(--accent); color: white; padding: 15px; border-radius: 12px; border: none; font-weight: bold; width: 100%; cursor: pointer; }
    .card { background: white; border-radius: 12px; padding: 15px; margin: 10px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <!-- LOADING SCREEN -->
  <div id="splash-screen">
    <div style="font-size:50px">🎗️</div>
    <div style="font-size:24px;font-weight:bold;margin-top:10px">PATHFINDER CLUB</div>
    <p>Version 6.1 (Firestore)</p>
  </div>
  <!-- OFFLINE SCREEN -->
  <div id="offline-screen">
    <div style="font-size:60px">📶</div>
    <h2>No Internet Connection</h2>
    <p>Please check your Wi-Fi or Data and try again.</p>
    <button class="btn-main" onclick="location.reload()">Retry Connection</button>
  </div>
  <!-- MAIN APP AREA -->
  <div id="main-app">
     <!-- The App logic will build the screens here -->
  </div>
  <script>
    // THE BRAINS OF THE APP
    const config = {
      apiKey: "AIzaSy...", // (Your API Key will automatically be used)
      projectId: "pathfinder-club-app-2b367",
    };
    // 1. Start Firebase Firestore
    if (!firebase.apps.length) firebase.initializeApp(config);
    const db = firebase.firestore();
    // 2. Fix the "Loading Screen Problem"
    function hideLoading() {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 500);
    }
    // 3. Internet Check
    window.addEventListener('online', () => document.getElementById('offline-screen').style.display = 'none');
    window.addEventListener('offline', () => document.getElementById('offline-screen').style.display = 'flex');
    if (!navigator.onLine) document.getElementById('offline-screen').style.display = 'flex';
    // 4. Emojis and Data
    const CLASSES = [
      { id: 'friend', n: 'Friend', e: '🌱' },
      { id: 'companion', n: 'Companion', e: '🌿' },
      { id: 'explorer', n: 'Explorer', e: '🧭' },
      { id: 'ranger', n: 'Ranger', e: '⛺' }
    ];
    // Wait 2 seconds, then show the app
    setTimeout(() => {
      console.log("App Started!");
      hideLoading();
    }, 2000);
  </script>
</body>
</html>
