<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pathfinder App">
    <link rel="apple-touch-icon" href="app-logo.png">
    <title>Pathfinder App Shell</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --bg3: #e8edf3;
            --card: #ffffff;
            --border: #d1dae6;
            --accent: #2563eb;
            --txt: #1e293b;
            --mut: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        
        body { background: var(--bg); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* SPLASH */
        #splash {
            position: fixed; inset: 0; z-index: 1000;
            background: linear-gradient(160deg, #050f20 0%, #0d2a6e 50%, #050f20 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .logo-wrap { width: 110px; height: 110px; margin-bottom: 24px; filter: drop-shadow(0 0 20px rgba(37, 99, 235, .4)); }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }
        .title { color: #fff; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .bar-wrap { width: 180px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 30px; overflow: hidden; }
        .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #059669); transition: width 0.3s; }

        /* OFFLINE */
        #offline {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 32px; width: 100%; max-width: 400px; text-align: center;
        }
        .off-card { background: var(--card); border-radius: 24px; padding: 40px 24px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; }
        .off-icon { font-size: 64px; margin-bottom: 16px; }
        .off-title { font-size: 22px; font-weight: 800; color: var(--txt); margin-bottom: 8px; }
        .off-msg { font-size: 14px; color: var(--mut); line-height: 1.6; margin-bottom: 24px; }
        .retry-btn { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,99,235,0.2);
        }
        .retry-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-wrap">
            <img src="app-logo.png" alt="Logo">
        </div>
        <div class="title">Pathfinder App</div>
        <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    </div>

    <div id="offline">
        <div class="off-card">
            <div class="off-icon">🌐</div>
            <div class="off-title">Connection Lost</div>
            <p class="off-msg">It looks like you're offline. Please check your internet connection to continue using the app.</p>
            <button class="retry-btn" onclick="checkConnection()">Try Again</button>
        </div>
    </div>

    <script>
        const remoteUrl = 'https://jeromejoshi18-ctrl.github.io/pathfinder-app/';
        const bar = document.getElementById('bar');
        
        function updateBar(p) { bar.style.width = p + '%'; }

        async function checkConnection() {
            updateBar(30);
            
            // 1. Basic navigator check
            if (!navigator.onLine) {
                showOffline();
                return;
            }

            updateBar(60);

            // 2. Try to "ping" the remote URL (or a tiny file on it)
            try {
                // Use a no-cache fetch to ensure we aren't seeing a stale result
                const response = await fetch(remoteUrl + 'index.html', { 
                    mode: 'no-cors', 
                    cache: 'no-store' 
                });
                
                updateBar(100);
                // If we get here, we are online enough to redirect
                setTimeout(() => {
                    window.location.href = remoteUrl;
                }, 300);
            } catch (e) {
                console.log('Online check failed:', e);
                showOffline();
            }
        }

        function showOffline() {
            document.getElementById('splash').style.display = 'none';
            document.getElementById('offline').style.display = 'flex';
            updateBar(0);
        }

        // Start checking after a short delay to show splash
        setTimeout(checkConnection, 1500);

        // Auto-check if connection comes back
        window.addEventListener('online', checkConnection);
    </script>
</body>
</html>
