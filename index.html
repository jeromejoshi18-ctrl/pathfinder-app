!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Pathfinder Club App V6.4</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    :root {
      --bg: #f0f4f8; --accent: #0047ab; --txt: #1e293b; --r: 12px;
    }
    body { font-family: sans-serif; background: var(--bg); margin: 0; }
    
    /* CLASSIC BLUE SPLASH */
    #splash-screen { 
      position: fixed; inset: 0; background: #0047ab; z-index: 10000; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      color: white; transition: 0.8s; 
    }
    .splash-logo img { width: 120px; height: auto; }
    .splash-name { font-size: 24px; font-weight: bold; margin-top: 15px; }
    .splash-loader { width: 140px; height: 4px; background: rgba(255,255,255,0.2); margin: 20px 0; overflow: hidden; }
    .splash-bar { width: 100%; height: 100%; background: white; animation: load 2s infinite linear; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .splash-verse { position: absolute; bottom: 40px; font-size: 13px; opacity: 0.8; }
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }
    .hero { background: #0047ab; padding: 50px; text-align: center; color: white; border-bottom-radius: 20px; }
    .btn-main { background: var(--accent); color: white; padding: 15px; border-radius: 12px; border: none; width: 100%; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <!-- LOADING SCREEN -->
  <div id="splash-screen">
    <div class="splash-logo">
      <!-- THIS LOOKS FOR YOUR LOGO FILE -->
      <img src="src/assets/logo.png" alt="Logo">
    </div>
    <div class="splash-name">Pathfinder Club</div>
    <div class="splash-loader"><div class="splash-bar"></div></div>
    <div class="splash-verse">"Let your light shine before others..."</div>
  </div>
  <!-- LOGIN SCREEN -->
  <div id="auth-screen" class="screen active">
    <div class="hero">
      <img src="src/assets/logo.png" style="width:80px">
      <h1>Pathfinder App</h1>
    </div>
    <div style="padding:20px">
       <input type="email" id="email" placeholder="Email" style="width:100%;padding:15px;margin-bottom:10px">
       <input type="password" id="pw" placeholder="Password" style="width:100%;padding:15px">
       <button class="btn-main" onclick="doSignIn()">Sign In</button>
    </div>
  </div>
  <script>
    firebase.initializeApp({ projectId: "pathfinder-club-app-2b367" });
    const db = firebase.firestore();
    async function doSignIn() {
      // ... Login logic here ...
      alert("Sign in clicked! Checking Firestore...");
    }
    window.onload = () => {
      setTimeout(() => {
        document.getElementById('splash-screen').style.opacity = '0';
        setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 800);
      }, 2000);
    };
  </script>
</body>
</html>
